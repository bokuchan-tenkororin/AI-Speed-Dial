<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Speed Dial</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="prompt-box">
        <input id="promptInput" type="text" placeholder="" autocomplete="off">
        <button id="sendBtn" title="Send">➤</button>
      </div>
      <p class="hint" style="display:none"></p>
    </header>
    <main>
      <div id="grid" class="grid"></div>
    </main>
    <footer>
      <button id="optionsBtn"></button>
    </footer>
  </div>
<script src="newtab.js"></script>
</body>
</html>
